<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اتصال قطع است</title>
  
  <style>
    :root {
      font-size: 14px;
    }
    
    
    @font-face {
      font-family: "IRANSans";
      src: url("../Fonts/IRANSans/woff2/IRANSansWeb(FaNum).woff2");
      font-weight: normal;
    }
    
    
    @font-face {
      font-family: "IRANSansBold";
      src: url("../Fonts/IRANSans/woff2/IRANSansWeb(FaNum)_Bold.woff2");
      font-weight: bold;
    }
    
    
    * {
      box-sizing: border-box;
      font-family: IRANSans, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    
    body {
      margin: 0;
      background: #fff;
      color: #1f2937;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    
    .container {
      width: 100%;
      max-width: 400px;
      padding: 24px;
      text-align: center;
    }
    
    
    .icon {
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    
    .icon img {
      width: 100%;
    }
    
    
    h1 {
      margin: 0 0 12px;
      font-size: 20px;
      color: #004944;
      font-family: IRANSansBold, serif;
    }
    
    
    p {
      margin: 0 0 24px;
      font-size: 14px;
      line-height: 1.8;
      color: #4b5563;
    }
    
    
    button {
      all: unset;
      cursor: pointer;
      display: inline-block;
      padding: .5rem 1rem;
      border-radius: .5rem;
      background: #004944;
      color: #fff;
      font-size: 1rem;
      transition: transform .1s ease, box-shadow .1s ease;
    }
    
    
    button:active {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .15) inset;
    }
    
    
    @media (max-width: 480px) {
      h1 {
        font-size: 18px;
      }
      
      .icon img {
        max-width: 280px;
      }
      
      p {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="icon">
    <img src="/static/noNet.png" alt="no-internet">
  </div>
  
  <h1>ارتباط قطع شده است</h1>
  <p>
    لطفاً اتصال اینترنت خود را بررسی کرده و دوباره تلاش کنید.
  </p>
  
  <button onclick="location.reload()">
    تلاش مجدد
  </button>
</div>

</body>
</html>
